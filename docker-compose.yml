services:
  db:
    image: postgres:16-alpine
    container_name: iom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iom}
      POSTGRES_DB: ${POSTGRES_DB:-iom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iom}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: iom-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-iom}:${POSTGRES_PASSWORD:-iom}@db:5432/${POSTGRES_DB:-iom}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTO_INIT_DB: "true"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time; points the SPA at the backend.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: iom-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
